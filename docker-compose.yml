services:
  frontend:
    build:
      context: frontend
    volumes:
      - frontend:/app/frontend/dist

  mongo:
    image: mongo:8.0
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db:/data/db
    ports:
      - 127.0.0.1:27018:27017
    networks:
      - internal

  backend:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      DB_ADDRESS: mongodb://root:example@mongo:27017/weblarek?authSource=admin
      TRUST_PROXY: 'true'
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - internal
    depends_on:
      - mongo

  server:
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: nginx
    ports:
      - 80:80
    volumes:
      - frontend:/var/app
      - public:/var/public
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - internal

volumes:
  frontend:
  public:
  db:

networks:
  internal:
